<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PLMun - Gate Scanner</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { font-family: 'Poppins', sans-serif; background: linear-gradient(-45deg, #800000, #4a0000, #ffc107, #1e1e2d); background-size: 400% 400%; animation: gradientBG 12s ease infinite; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 15px; }
        @keyframes gradientBG { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

        .terminal-card { background: #ffffff; width: 100%; max-width: 500px; padding: 30px; border-radius: 24px; box-shadow: 0 25px 50px rgba(0,0,0,0.4); text-align: center; }
        
        #reader { width: 100%; border-radius: 16px; overflow: hidden; border: 3px solid #800000; margin-bottom: 20px; display: none; box-shadow: 0 0 25px rgba(128,0,0,0.3); }
        
        .status-area { padding: 25px 20px; border-radius: 20px; display: none; margin-bottom: 20px; animation: slideUp 0.3s ease-out; }
        .status-title { font-size: 36px; font-weight: 800; margin-bottom: 5px; }
        .status-name { font-size: 18px; font-weight: 600; opacity: 0.9; }
        
        .bg-in { background: #e8f5e9; color: #2e7d32; border: 2px solid #c8e6c9; }
        .bg-out { background: #e3f2fd; color: #1565c0; border: 2px solid #bbdefb; }
        .bg-error { background: #ffebee; color: #c62828; border: 2px solid #ffcdd2; }
        
        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .btn-custom { background: linear-gradient(135deg, #800000, #cc0000); color: white; border: none; padding: 15px; border-radius: 12px; font-weight: 600; width: 100%; transition: 0.3s; font-size: 16px; box-shadow: 0 5px 15px rgba(128,0,0,0.3); }
        .btn-custom:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(128,0,0,0.5); }
        .btn-outline-custom { border: 2px solid #eaeaea; color: #666; padding: 12px; border-radius: 12px; font-weight: 600; width: 100%; transition: 0.3s; background: transparent; }
        .btn-outline-custom:hover { border-color: #800000; color: #800000; }
    </style>
</head>
<body>

<div class="terminal-card">
    <div class="mb-4">
        <h2 style="color: #1a1a1a; font-weight: 700;">Gate Terminal</h2>
        <p style="color: #666; font-size: 14px;">Position the QR code within the frame.</p>
    </div>
    
    <div id="reader"></div>
    <div id="statusBox" class="status-area"></div>
    
    <div id="controls">
        <button id="startBtn" class="btn-custom mb-3" onclick="startCamera()">📷 Start Camera</button>
        <button id="stopBtn" class="btn-outline-custom mb-3" onclick="stopCamera()" style="display: none;">⏹️ Stop Camera</button>
    </div>
    
    <div class="d-flex justify-content-between align-items-center mt-3">
        <a href="admin_dashboard.html" class="text-decoration-none small fw-semibold" style="color: #666;">← Dashboard</a>
        <a href="#" onclick="logout()" class="text-danger text-decoration-none small fw-semibold">Logout</a>
    </div>
</div>

<script>
    const currentUser = JSON.parse(localStorage.getItem('currentUser'));
    
    // 🔒 SECURITY: Admin/Staff Only
    if (!currentUser) {
        window.location.href = 'login.html';
    } else if (currentUser.role !== 'Admin' && currentUser.role !== 'Staff') {
        alert('Access Denied. Only Security/Admin can use the scanner.');
        if (currentUser.role === 'Student' || currentUser.role === 'Faculty') window.location.href = 'student_dashboard.html';
        else if (currentUser.role === 'Visitor') window.location.href = 'visitor_dashboard.html';
        else window.location.href = 'login.html';
    }

    const API_URL = 'https://script.google.com/macros/s/AKfycbwKzx8BuI5dlM3hPCtN5S0UodKuLKBQDQRmVAzWnn0qlkxbkmoM2OuAwIpN1Z3X66G7/exec';
    const statusBox = document.getElementById('statusBox');
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const readerDiv = document.getElementById('reader');

    let html5QrCode;

    function startCamera() {
        readerDiv.style.display = 'block';
        startBtn.style.display = 'none';
        stopBtn.style.display = 'block';
        statusBox.style.display = 'none';

        html5QrCode = new Html5Qrcode("reader");
        const config = { fps: 10, qrbox: { width: 250, height: 250 } };

        html5QrCode.start({ facingMode: "environment" }, config, onScanSuccess, onScanError)
        .catch(err => {
            alert("Camera Error: " + err + "\n\nMake sure you are using HTTPS.");
            stopCamera();
        });
    }

    function stopCamera() {
        if (html5QrCode) {
            html5QrCode.stop().then(() => {
                readerDiv.style.display = 'none';
                startBtn.style.display = 'block';
                stopBtn.style.display = 'none';
            }).catch(err => console.error(err));
        }
    }

    function playSound(type) {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        if (type === 'success') { osc.frequency.value = 880; } 
        if (type === 'error') { osc.frequency.value = 200; } 
        osc.start();
        gain.gain.exponentialRampToValueAtTime(0.00001, ctx.currentTime + 0.5);
        osc.stop(ctx.currentTime + 0.5);
    }

    async function onScanSuccess(decodedText, decodedResult) {
        if (html5QrCode) html5QrCode.pause(true);

        statusBox.style.display = 'block';
        statusBox.className = 'status-area bg-in'; 
        statusBox.innerHTML = '<h4 class="m-0" style="color: #666;">Processing...</h4>';

        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                body: JSON.stringify({ action: 'scan', qrString: decodedText }),
                headers: { 'Content-Type': 'text/plain' }
            });
            
            const result = await response.json();

            if (result.success) {
                playSound('success');
                if (result.action === 'IN') {
                    statusBox.className = 'status-area bg-in';
                    statusBox.innerHTML = `<div class="status-title">IN</div><div class="status-name">${result.name}</div>`;
                } else {
                    statusBox.className = 'status-area bg-out';
                    statusBox.innerHTML = `<div class="status-title">OUT</div><div class="status-name">${result.name}</div>`;
                }
            } else {
                playSound('error');
                statusBox.className = 'status-area bg-error';
                statusBox.innerHTML = `<div class="status-title" style="font-size: 24px;">DENIED</div><div class="status-name" style="font-size:14px;">${result.message}</div>`;
            }
        } catch (error) {
            playSound('error');
            statusBox.className = 'status-area bg-error';
            statusBox.innerHTML = `<div class="status-title" style="font-size: 24px;">OFFLINE</div><div class="status-name" style="font-size:14px;">Check network connection.</div>`;
        }

        setTimeout(() => {
            statusBox.style.display = 'none';
            if (html5QrCode && html5QrCode.getState() === 2) { html5QrCode.resume(); }
        }, 3000);
    }

    function onScanError(errorMessage) { /* Ignore */ }

    function logout() { localStorage.removeItem('currentUser'); window.location.href = 'login.html'; }
</script>
</body>
</html>
