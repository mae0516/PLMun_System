<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PLMun - Visitor Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        body { font-family: 'Poppins', sans-serif; background: linear-gradient(-45deg, #f0f2f5, #e0eafc, #fce4e4, #f0f2f5); background-size: 400% 400%; animation: gradientBG 15s ease infinite; color: #1a1a1a; padding-bottom: 90px; }
        @keyframes gradientBG { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        .container-custom { max-width: 900px; margin: 0 auto; padding: 30px 20px; }
        .card-clean { background: #ffffff; border-radius: 20px; border: none; box-shadow: 0 10px 30px rgba(0,0,0,0.08); padding: 30px; height: 100%; transition: transform 0.3s; }
        .card-clean:hover { transform: translateY(-5px); }
        .qr-wrapper { position: relative; display: inline-block; padding: 15px; background: #fff; border-radius: 24px; box-shadow: 0 10px 25px rgba(255,193,7,0.3); border: 3px solid #ffc107; }
        .qr-img { width: 100%; max-width: 240px; height: auto; border-radius: 12px; display: block; margin: 0 auto; }
        .pass-badge { background: #fff3cd; color: #856404; padding: 8px 20px; border-radius: 50px; font-size: 13px; font-weight: 700; letter-spacing: 1px; display: inline-block; margin-bottom: 20px; border: 1px solid #ffeeba; }
        .btn-maroon { background: linear-gradient(135deg, #800000, #cc0000); color: white; border: none; border-radius: 12px; padding: 14px; font-weight: 600; transition: 0.3s; width: 100%; display: flex; justify-content: center; align-items: center; gap: 8px; box-shadow: 0 5px 15px rgba(128,0,0,0.3); }
        .btn-maroon:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(128,0,0,0.5); color: white; }
        .table-clean { width: 100%; border-collapse: separate; border-spacing: 0 8px; }
        .table-clean th { color: #666; font-weight: 600; font-size: 12px; padding: 10px 15px; text-transform: uppercase; }
        .table-clean td { background: #f8f9fa; padding: 15px; vertical-align: middle; font-size: 14px; font-weight: 500; border: 1px solid #eaeaea; }
        .table-clean tr td:first-child { border-top-left-radius: 12px; border-bottom-left-radius: 12px; border-right: none; }
        .table-clean tr td:last-child { border-top-right-radius: 12px; border-bottom-right-radius: 12px; border-left: none; }
        .top-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .user-pill { background: #fff; padding: 8px 16px; border-radius: 50px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); display: flex; align-items: center; gap: 10px; font-weight: 600; color: #1a1a1a; }
        .avatar { width: 32px; height: 32px; background: #ffc107; color: #333; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; }
        .mobile-nav { display: none; position: fixed; bottom: 0; left: 0; width: 100%; background: #ffffff; box-shadow: 0 -4px 20px rgba(0,0,0,0.08); z-index: 1000; padding: 10px 20px; justify-content: space-around; border-top-left-radius: 20px; border-top-right-radius: 20px; }
        .mobile-nav a { display: flex; flex-direction: column; align-items: center; color: #888; text-decoration: none; font-size: 12px; font-weight: 600; gap: 4px; }
        .mobile-nav a.active, .mobile-nav a:hover { color: #800000; }
        .mobile-nav i { font-size: 20px; }
        @media (max-width: 768px) {
            .col-md-5, .col-md-7 { width: 100% !important; }
            .top-header { flex-direction: column; align-items: center !important; text-align: center; gap: 15px; }
            .user-pill { justify-content: center; width: 100%; max-width: 200px; }
            .mobile-nav { display: flex; }
            .card-clean { padding: 20px; text-align: center; }
            .table-clean th, .table-clean td { padding: 10px; font-size: 12px; }
        }
    </style>
</head>
<body>
<div class="mobile-nav d-md-none">
    <a href="#" class="active"><i class="bi bi-ticket-perforated-fill"></i> My Pass</a>
    <a href="#historySection"><i class="bi bi-clock-history"></i> History</a>
    <a href="#" onclick="logout()"><i class="bi bi-box-arrow-right"></i> Logout</a>
</div>

<div class="container-custom">
    <div class="top-header">
        <div>
            <h3 class="fw-bold mb-1" style="color: #1a1a1a;">Visitor Portal</h3>
            <p class="mb-0 small d-none d-md-block" style="color: #555; font-weight: 500;">Welcome to PLMun Campus.</p>
        </div>
        <div class="user-pill">
            <div class="avatar" id="navAvatar">V</div>
            <span id="navRole">Visitor</span>
        </div>
    </div>

    <div class="row g-4 mb-4">
        <div class="col-md-5 mb-3 mb-md-0">
            <div class="card-clean text-center">
                <span class="pass-badge">VISITOR PASS</span>
                <div class="qr-wrapper mb-4"><img id="myQR" src="" alt="Visitor QR Code" class="qr-img"></div>
                <p class="small mb-4 px-2" style="color: #666;">Present this at the guard house.</p>
                <button class="btn btn-maroon" onclick="downloadQR()"><i class="bi bi-download"></i> Download Pass</button>
            </div>
        </div>

        <div class="col-md-7">
            <div class="card-clean mb-4 text-start">
                <h6 class="fw-bold mb-4" style="color: #666; letter-spacing: 1px; text-transform: uppercase; font-size: 12px;">Visitor Details</h6>
                <div class="row g-3">
                    <div class="col-12 col-sm-6"><small style="color: #888; font-weight: 600;">Full Name</small><p class="fw-bold mb-0" style="color: #1a1a1a;" id="profileName">-</p></div>
                    <div class="col-12 col-sm-6"><small style="color: #888; font-weight: 600;">Email Address</small><p class="fw-bold mb-0" style="color: #1a1a1a;" id="profileEmail">-</p></div>
                    <div class="col-12 col-sm-6"><small style="color: #888; font-weight: 600;">Pass ID</small><p class="fw-bold mb-0" style="color: #1a1a1a;" id="profileID">-</p></div>
                </div>
            </div>

            <div class="card-clean" id="historySection">
                <h6 class="fw-bold mb-4" style="color: #666; letter-spacing: 1px; text-transform: uppercase; font-size: 12px;">Visit History</h6>
                <div class="table-responsive">
                    <table class="table table-clean table-hover">
                        <thead><tr><th>Date & Time</th><th>Action</th><th>Gate</th></tr></thead>
                        <tbody id="historyTable"><tr><td colspan="3" class="text-center py-4" style="color: #888;">Loading...</td></tr></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const currentUser = JSON.parse(localStorage.getItem('currentUser'));
    
    // 🔒 ULTIMATE SECURITY CHECK
    if (!currentUser) {
        window.location.href = 'login.html';
    } else if (currentUser.role !== 'Visitor') {
        localStorage.removeItem('currentUser'); 
        alert('Access Denied. This portal is for Visitors only. Please log in again.');
        window.location.href = 'login.html';
    }

    const API_URL = 'https://script.google.com/macros/s/AKfycbwKzx8BuI5dlM3hPCtN5S0UodKuLKBQDQRmVAzWnn0qlkxbkmoM2OuAwIpN1Z3X66G7/exec';
    
    document.getElementById('navAvatar').innerText = currentUser.fullName.charAt(0).toUpperCase();
    document.getElementById('profileName').innerText = currentUser.fullName;
    document.getElementById('profileEmail').innerText = currentUser.email;
    document.getElementById('profileID').innerText = currentUser.userId;
    document.getElementById('myQR').src = `https://api.qrserver.com/v1/create-qr-code/?size=400x400&data=${encodeURIComponent(currentUser.qrString)}`;

    function downloadQR() {
        const link = document.createElement('a');
        link.href = `https://api.qrserver.com/v1/create-qr-code/?size=800x800&data=${encodeURIComponent(currentUser.qrString)}`;
        link.download = 'PLMun_VisitorPass_' + currentUser.fullName.replace(/\s+/g, '_') + '.png';
        link.click();
    }

    async function loadHistory() {
        const tbody = document.getElementById('historyTable');
        try {
            const response = await fetch(`${API_URL}?action=personalLogs&userId=${currentUser.userId}`);
            const result = await response.json();
            tbody.innerHTML = '';
            if (result.success && result.logs.length > 0) {
                result.logs.forEach(log => {
                    const badge = log.action === 'IN' ? '<span class="badge bg-success px-3 py-2 rounded-pill">IN</span>' : '<span class="badge bg-danger px-3 py-2 rounded-pill">OUT</span>';
                    tbody.innerHTML += `<tr><td class="fw-semibold" style="color: #666;">${log.time}</td><td>${badge}</td><td class="fw-semibold" style="color: #666;">${log.gate}</td></tr>`;
                });
            } else { tbody.innerHTML = '<tr><td colspan="3" class="text-center py-4" style="color: #888;">No visit records yet.</td></tr>'; }
        } catch (e) { tbody.innerHTML = '<tr><td colspan="3" class="text-danger text-center">Error loading data.</td></tr>'; }
    }
    loadHistory();
    function logout() { localStorage.removeItem('currentUser'); window.location.href = 'login.html'; }
</script>
</body>
</html>
